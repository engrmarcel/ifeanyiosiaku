name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      # Production target engine (ADR-014). Local development may use MariaDB.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ifeanyiosiaku_testing
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, intl, bcmath, gd, sodium, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests (Pest)
        run: vendor/bin/pest

      - name: Dependency vulnerabilities
        run: composer audit --locked

  web:
    name: Website (Next.js)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          API_INTERNAL_URL: http://127.0.0.1:8110

      # Production dependencies must be free of high/critical advisories. Dev-only tooling
      # advisories are reviewed manually (see docs/IMPLEMENTATION_ROADMAP.md, known issues).
      - name: Dependency vulnerabilities (production)
        run: npm audit --omit=dev --audit-level=high
